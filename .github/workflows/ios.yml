name: ios

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths: [".github/workflows/ios.yml"]

concurrency:
  group: ios-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Download Xcode project (from xcode-src release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xcode-src --repo "$GITHUB_REPOSITORY" \
            --pattern "NuOS-xcode.zip" --output xcodeproj.zip --clobber
          [ -f xcodeproj.zip ] || mv xcode xcodeproj.zip
          ls -lh xcodeproj.zip
          unzip -q xcodeproj.zip
          find . -maxdepth 5 -name "*.xcodeproj" -type d

      - name: Build (unsigned, iphoneos)
        run: |
          PROJ=$(find . -maxdepth 5 -name "Unity-iPhone.xcodeproj" -type d | head -1)
          cd "$(dirname "$PROJ")"
          set -o pipefail
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > build.log 2>&1 || { grep -aE "error:" build.log | head -30; \
            grep -aB2 -A12 "Undefined symbols" build.log | head -40; \
            grep -aB2 -A6 "The following build commands failed" build.log | head -20; exit 1; }
          grep -aE "error:" build.log | head -10 || true

      - name: Package unsigned IPA
        run: |
          find . -type d -name "*.app" -path "*Release-iphoneos*" -exec du -sh {} + 2>/dev/null || true
          APP=$(find . -type d -name "*.app" -path "*Release-iphoneos*" -exec du -sm {} + 2>/dev/null | sort -rn | head -1 | cut -d$'	' -f2-)
          echo "selected APP: $APP"
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry NuOS.ipa Payload
          ls -lh NuOS.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuOS-ipa
          path: NuOS.ipa
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NuOS.ipa \
            --title "NuOS $GITHUB_REF_NAME" --generate-notes --latest \
          || gh release upload "$GITHUB_REF_NAME" NuOS.ipa --clobber
