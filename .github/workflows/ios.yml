name: ios

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths: [".github/workflows/ios.yml"]

concurrency:
  group: ios-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Download Xcode project (from xcode-src release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xcode-src --repo "$GITHUB_REPOSITORY" \
            --pattern "NuOS-xcode.zip" --output xcode.zip --clobber
          ls -lh xcode.zip
          unzip -q xcode.zip
          find . -maxdepth 3 -name "*.xcodeproj" -type d

      - name: Build (unsigned, iphoneos)
        run: |
          PROJ=$(find . -maxdepth 3 -name "Unity-iPhone.xcodeproj" -type d | head -1)
          cd "$(dirname "$PROJ")"
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -12

      - name: Package unsigned IPA
        run: |
          APP=$(find . -type d -name "*.app" -path "*Release-iphoneos*" | head -1)
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry NuOS.ipa Payload
          ls -lh NuOS.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuOS-ipa
          path: NuOS.ipa
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NuOS.ipa \
            --title "NuOS $GITHUB_REF_NAME" --generate-notes --latest \
          || gh release upload "$GITHUB_REF_NAME" NuOS.ipa --clobber
