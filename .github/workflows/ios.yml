name: ios-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -1
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/NuosView
        run: xcodegen

      - name: Archive (unsigned)
        working-directory: ios/NuosView
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NuosView.xcodeproj \
            -scheme NuosView \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NuosView.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Package unsigned IPA
        run: |
          APP=$(find ios/NuosView/build -type d -name "NuosView.app" | head -n1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r NuosView.ipa Payload
          mkdir -p dist
          mv NuosView.ipa dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuosView-ipa
          path: dist/NuosView.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/NuosView.ipa \
            --title "NuOS $GITHUB_REF_NAME" \
            --generate-notes --latest
