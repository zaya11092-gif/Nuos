# Board profile: Lenovo IdeaPad Flex 5 Chromebook (geddon), MrChromebox
# UEFI Full ROM, i3-1215U Alder Lake-P, Intel AX201 Wi-Fi, UHD 64EU iGPU.
# Sourced by distro/build-image.sh (shell syntax).

# Extra kernel cmdline appended to distro/overlay/etc/kernel/cmdline.
# video=eDP-1:off keeps the laptop panel dark; console lives on ttyS0.
CMDLINE_EXTRA="i915.enable_guc=2 i915.enable_fbc=1"

# Wi-Fi AP settings consumed by the build and by nuos-firstboot.
WIFI_INTERFACE=wlan0
AP_SUBNET=10.66.0.1/24

# Whether nuos-power-tune.service is enabled in the built image.
POWER_TUNE=true
