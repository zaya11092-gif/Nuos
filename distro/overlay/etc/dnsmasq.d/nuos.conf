# NuOS AP DHCP/DNS — serves the phone on the 10.66.0.0/24 AP subnet.
# dnsmasq picks up /etc/dnsmasq.d automatically via its main config.
interface=wlan0
except-interface=lo
# DHCP pool: 10.66.0.2 - 10.66.0.50, 12h leases
dhcp-range=10.66.0.2,10.66.0.50,255.255.255.0,12h
# Board is the AP gateway / DNS for clients
listen-address=10.66.0.1
dhcp-option=option:router,10.66.0.1
dhcp-option=option:dns-server,10.66.0.1
# Long leases keep the phone's IP stable for board->phone UDP video
dhcp-authoritative
