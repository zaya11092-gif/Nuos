# NuOS Wi-Fi AP template — @INTERFACE@/@SSID@/@PSK@ are substituted by
# /usr/local/sbin/nuos-firstboot on first boot. Until then this file holds
# placeholders and hostapd may fail harmlessly until firstboot rewrites it.
interface=@INTERFACE@
driver=nl80211
ssid=@SSID@
country_code=US
ieee80211d=1

# 5 GHz, 36 (DFS-free)
hw_mode=a
channel=36

# 802.11n (HT), WMM required for usable throughput
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
wmm_enabled=1

# WPA2-PSK, CCMP only (iPhone compatible)
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=@PSK@

auth_algs=1
ignore_broadcast_ssid=0
